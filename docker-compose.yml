services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: underdog
      POSTGRES_USER: underdog
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-underdog}
    ports:
      - "5432:5432"
    volumes:
      - underdog_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U underdog -d underdog"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "4000:4000"
    environment:
      API_PORT: 4000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      DATABASE_URL: postgres://underdog:${POSTGRES_PASSWORD:-underdog}@db:5432/underdog
      API_AUTO_SEED: ${API_AUTO_SEED:-1}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      HOSTNAME: 0.0.0.0
      API_URL: http://api:4000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
      NEXT_PUBLIC_BOT_URL: ${NEXT_PUBLIC_BOT_URL:-https://t.me/BotFather}
      NODE_ENV: production
    depends_on:
      - api
    restart: unless-stopped

  helper:
    build:
      context: .
      dockerfile: apps/helper/Dockerfile
    environment:
      DATABASE_URL: postgres://underdog:${POSTGRES_PASSWORD:-underdog}@db:5432/underdog
      BOT_TOKEN: ${BOT_TOKEN:-}
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_SESSION: ${TELEGRAM_SESSION:-}
      HELPER_AUTO_SEED: ${HELPER_AUTO_SEED:-1}
      HELPER_BATCH_SIZE: ${HELPER_BATCH_SIZE:-8}
      HELPER_INTERVAL_MS: ${HELPER_INTERVAL_MS:-60000}
      HELPER_DELAY_MS: ${HELPER_DELAY_MS:-2000}
      HELPER_DISCOVER_EVERY: ${HELPER_DISCOVER_EVERY:-1}
      HELPER_QUERIES_PER_TICK: ${HELPER_QUERIES_PER_TICK:-2}
      HELPER_SEED_USERNAMES: ${HELPER_SEED_USERNAMES:-}
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - helper
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: apps/bot/Dockerfile
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      ADMIN_CHAT_ID: ${ADMIN_CHAT_ID:-}
      WEB_URL: ${WEB_URL:-http://localhost:3000}
      API_URL: http://api:4000
      NODE_ENV: production
    depends_on:
      - api
    profiles:
      - bot
    restart: unless-stopped

volumes:
  underdog_pg:
